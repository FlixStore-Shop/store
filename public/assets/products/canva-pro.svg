<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031f24"/>
      <stop offset="50%" stop-color="#060f14"/>
      <stop offset="100%" stop-color="#042630"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00C4CC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00C4CC" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00C4CC" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" fill="url(#cardBg)"/>
  <rect width="600" height="360" fill="url(#cardGlow)"/>

  <!-- Subtle Ambient Grid / Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
  </g>

  <!-- Centered Official Logo Artwork -->
  <g transform="translate(300, 140)">
    
      <!-- Canva Script & Crown -->
      <g filter="url(#dropGlow)" transform="translate(0, -12)">
        <circle cx="0" cy="0" r="44" fill="#00C4CC"/>
        <text x="0" y="14" font-family="'Brush Script MT', cursive, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">
          Canva
        </text>
        <!-- Crown -->
        <polygon points="-12,-38 0,-48 12,-38 8,-30 -8,-30" fill="#FBBF24"/>
      </g>
    
  </g>

  <!-- Brand Title -->
  <text x="300" y="245" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="28" 
    font-weight="800" 
    fill="#ffffff" 
    letter-spacing="0.5">
    Canva Pro Lifetime
  </text>

  <!-- Badge Pill -->
  
  <g transform="translate(300, 275)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="rgba(0, 196, 204, 0.2)" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf" letter-spacing="1">
      BRAND KIT UNLOCKED
    </text>
  </g>

  <!-- Feature Subtitle -->
  <text x="300" y="320" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="13" 
    font-weight="500" 
    fill="rgba(255, 255, 255, 0.7)" 
    letter-spacing="0.3">
    100M+ Stock Assets • 1-Click Background Remover • Magic AI
  </text>
</svg>