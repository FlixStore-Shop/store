<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211510"/>
      <stop offset="50%" stop-color="#0f0c0b"/>
      <stop offset="100%" stop-color="#1f1008"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#D97706" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" fill="url(#cardBg)"/>
  <rect width="600" height="360" fill="url(#cardGlow)"/>

  <!-- Subtle Ambient Grid / Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
  </g>

  <!-- Centered Official Logo Artwork -->
  <g transform="translate(300, 140)">
    
      <!-- Anthropic Claude Spark / Sunburst Logo -->
      <g filter="url(#dropGlow)" transform="translate(0, -10)">
        <circle cx="0" cy="0" r="42" fill="#D97706" opacity="0.15"/>
        <g stroke="#E07A5F" stroke-width="8" stroke-linecap="round">
          <line x1="0" y1="-34" x2="0" y2="34"/>
          <line x1="-34" y1="0" x2="34" y2="0"/>
          <line x1="-24" y1="-24" x2="24" y2="24"/>
          <line x1="-24" y1="24" x2="24" y2="-24"/>
        </g>
        <circle cx="0" cy="0" r="10" fill="#E07A5F"/>
      </g>
    
  </g>

  <!-- Brand Title -->
  <text x="300" y="245" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="28" 
    font-weight="800" 
    fill="#ffffff" 
    letter-spacing="0.5">
    Claude Pro (Anthropic)
  </text>

  <!-- Badge Pill -->
  
  <g transform="translate(300, 275)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="rgba(217, 119, 6, 0.2)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">
      TOP FOR DEVELOPERS
    </text>
  </g>

  <!-- Feature Subtitle -->
  <text x="300" y="320" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="13" 
    font-weight="500" 
    fill="rgba(255, 255, 255, 0.7)" 
    letter-spacing="0.3">
    Claude 3.5 Sonnet • Artifacts • 200K Context Codebase
  </text>
</svg>