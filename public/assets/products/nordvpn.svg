<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03162b"/>
      <stop offset="50%" stop-color="#060d17"/>
      <stop offset="100%" stop-color="#082245"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4687FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4687FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4687FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" fill="url(#cardBg)"/>
  <rect width="600" height="360" fill="url(#cardGlow)"/>

  <!-- Subtle Ambient Grid / Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="270" x2="600" y2="270" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
  </g>

  <!-- Centered Official Logo Artwork -->
  <g transform="translate(300, 140)">
    
      <!-- NordVPN Mountain Crest -->
      <g filter="url(#dropGlow)" transform="translate(0, -10)">
        <circle cx="0" cy="0" r="44" fill="#4687FF"/>
        <path d="M-26 20 L-10 -16 L2 4 L14 -8 L26 20 Z" fill="#FFFFFF"/>
        <path d="M-10 -16 L-2 4 L2 4 Z" fill="#D0E2FF"/>
      </g>
    
  </g>

  <!-- Brand Title -->
  <text x="300" y="245" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="28" 
    font-weight="800" 
    fill="#ffffff" 
    letter-spacing="0.5">
    NordVPN & Security
  </text>

  <!-- Badge Pill -->
  
  <g transform="translate(300, 275)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="rgba(70, 135, 255, 0.2)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">
      MILITARY ENCRYPTION
    </text>
  </g>

  <!-- Feature Subtitle -->
  <text x="300" y="320" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="13" 
    font-weight="500" 
    fill="rgba(255, 255, 255, 0.7)" 
    letter-spacing="0.3">
    6,400+ 10Gbps Servers • Threat Protection • No-Logs Policy
  </text>
</svg>