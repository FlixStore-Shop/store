<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00a8e1" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#007eb9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8e1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#glowGrad)"/>

  <!-- Subtle Ambient Diagonal Lines / Cinematic Texture -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5">
    <line x1="0" y1="80" x2="600" y2="280"/>
    <line x1="0" y1="160" x2="600" y2="360"/>
    <line x1="0" y1="0" x2="600" y2="200"/>
  </g>

  <!-- Center Card Emblem with Glow -->
  <g filter="url(#shadow)">
    <!-- Main prime video text & arrow logo -->
    <g transform="translate(145, 140)">
      <!-- "prime video" text -->
      <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1px">
        prime <tspan font-weight="300" fill="#00a8e1">video</tspan>
      </text>

      <!-- Iconic Amazon / Prime smile arrow -->
      <path d="M 12 78 C 65 106, 175 106, 228 76" fill="none" stroke="url(#accentGrad)" stroke-width="6.5" stroke-linecap="round"/>
      <!-- Arrow tip -->
      <path d="M 224 64 L 235 77 L 218 83 Z" fill="#00a8e1"/>
    </g>
  </g>

  <!-- Quality Tags -->
  <g transform="translate(200, 270)">
    <rect x="0" y="0" width="76" height="24" rx="4" fill="rgba(0, 168, 225, 0.15)" stroke="rgba(0, 168, 225, 0.4)" stroke-width="1"/>
    <text x="38" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">4K UHD</text>

    <rect x="84" y="0" width="56" height="24" rx="4" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text x="112" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">HDR</text>

    <rect x="148" y="0" width="56" height="24" rx="4" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <text x="176" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">X-RAY</text>
  </g>
</svg>
